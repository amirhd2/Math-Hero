<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Inner Concentric Soft Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6"/>

  <!-- Golden Central Star Crest -->
  <g filter="url(#glow)">
    <!-- Main Math Hero Badge -->
    <circle cx="256" cy="240" r="140" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="256" cy="240" r="115" fill="#ffffff" fill-opacity="0.18"/>

    <!-- Spark Star -->
    <path d="M 256 140 L 280 216 L 356 240 L 280 264 L 256 340 L 232 264 L 156 240 L 232 216 Z" fill="url(#goldGrad)"/>
    <circle cx="256" cy="240" r="28" fill="#ffffff"/>
  </g>

  <!-- Math Symbols in Corners -->
  <!-- Plus (Top Left) -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="90" y="105" width="36" height="10" rx="5"/>
    <rect x="103" y="92" width="10" height="36" rx="5"/>
  </g>

  <!-- Multiply (Top Right) -->
  <g fill="#ffffff" opacity="0.85" transform="rotate(45 395 110)">
    <rect x="377" y="105" width="36" height="10" rx="5"/>
    <rect x="390" y="92" width="10" height="36" rx="5"/>
  </g>

  <!-- Minus (Bottom Left) -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="90" y="380" width="36" height="10" rx="5"/>
  </g>

  <!-- Divide (Bottom Right) -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="395" cy="365" r="5"/>
    <rect x="377" y="380" width="36" height="10" rx="5"/>
    <circle cx="395" cy="405" r="5"/>
  </g>

  <!-- Title Pill at Bottom -->
  <rect x="136" y="415" width="240" height="42" rx="21" fill="#ffffff" fill-opacity="0.25"/>
  <text x="256" y="442" font-family="sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MATH HERO</text>
</svg>
