<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>قهرمان ریاضی | Math Hero</title>
    <meta name="description" content="پلتفرم آموزشی و بازی‌وارسازی ریاضی برای کودکان و دانش‌آموزان" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="قهرمان ریاضی" />
    <meta name="application-name" content="قهرمان ریاضی" />
    <meta property="og:title" content="قهرمان ریاضی | Math Hero" />
    <meta property="og:description" content="پلتفرم آموزشی و بازی‌وارسازی ریاضی برای کودکان" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./assets/icons/android-chrome-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      @keyframes owlFloat {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-12px) rotate(-1.8deg);
        }
      }
      @keyframes pulseAura {
        0%, 100% {
          transform: scale(1);
          opacity: 0.65;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.95;
        }
      }
      @keyframes floatBadge1 {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(8deg); }
      }
      @keyframes floatBadge2 {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(-10deg); }
      }
      @keyframes floatBadge3 {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(6deg); }
      }
      @keyframes titleEntrance {
        0% {
          opacity: 0;
          transform: translateY(22px) scale(0.92);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes subtitleEntrance {
        0% {
          opacity: 0;
          transform: translateY(14px);
        }
        100% {
          opacity: 0.95;
          transform: translateY(0);
        }
      }
      @keyframes splashProgressBar {
        0% {
          left: -40%;
          width: 35%;
        }
        50% {
          left: 30%;
          width: 60%;
        }
        100% {
          left: 105%;
          width: 35%;
        }
      }
      @keyframes spinSlow {
        to { transform: rotate(360deg); }
      }

      #app-fallback-loader {
        min-height: 100vh;
        width: 100%;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 32%, #2e1065 0%, #1e1b4b 45%, #0f172a 82%, #080b14 100%);
        color: #f8fafc;
        font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 1.5rem;
        box-sizing: border-box;
        overflow: hidden;
      }
    </style>
    <script>
      // 1. Purge legacy broken caches if any exist
      if (typeof caches !== 'undefined') {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) {
            if (key === 'static-assets-cache' || key === 'navigation-cache') {
              caches.delete(key);
            }
          });
        }).catch(function() {});
      }

      // 2. Self-healing hard reset function with guaranteed cache bypass
      window.hardResetApp = function() {
        var btn = document.getElementById('btn-reset-cache');
        if (btn) {
          btn.innerText = 'در حال پاکسازی و اتصال مجدد... ⏳';
          btn.disabled = true;
          btn.style.opacity = '0.7';
          btn.style.cursor = 'wait';
        }
        var statusTxt = document.getElementById('fallback-status-text');
        if (statusTxt) statusTxt.innerText = 'حافظه موقت پاک شد. در حال بارگذاری نسخه جدید...';

        var pCaches = (typeof caches !== 'undefined')
          ? caches.keys().then(function(names) {
              return Promise.all(names.map(function(n) { return caches.delete(n); }));
            })
          : Promise.resolve();

        var pSW = ('serviceWorker' in navigator)
          ? navigator.serviceWorker.getRegistrations().then(function(registrations) {
              return Promise.all(registrations.map(function(r) { return r.unregister(); }));
            })
          : Promise.resolve();

        Promise.all([pCaches, pSW]).then(function() {
          try { sessionStorage.clear(); } catch(e) {}
          // Force network fetch with timestamp query param to completely bypass disk cache
          var cleanUrl = window.location.origin + window.location.pathname + '?fresh=' + Date.now();
          window.location.replace(cleanUrl);
        }).catch(function() {
          window.location.reload();
        });
      };

      // 3. Progressive status updates (avoids false-alarm button showing after only 3.5s)
      var t1 = setTimeout(function() {
        var statusTxt = document.getElementById('fallback-status-text');
        if (statusTxt) statusTxt.innerText = 'در حال بارگذاری فایل‌های برنامه و تنظیم فونت‌ها...';
      }, 4000);

      var t2 = setTimeout(function() {
        var statusTxt = document.getElementById('fallback-status-text');
        if (statusTxt) statusTxt.innerText = 'بارگذاری منابع در حال تکمیل است، لطفا شکیبا باشید...';
      }, 9000);

      var t3 = setTimeout(function() {
        var recoveryBox = document.getElementById('fallback-recovery-action');
        var statusTxt = document.getElementById('fallback-status-text');
        if (recoveryBox) recoveryBox.style.display = 'block';
        if (statusTxt) statusTxt.innerText = 'اگر صفحه باز نشد، ممکن است حافظه کش قدیمی فعال باشد. دکمه زیر را لمس کنید:';
      }, 15000);

      // 4. Capture fatal runtime errors and resource loading errors immediately
      window.addEventListener('error', function(err) {
        console.error('Fatal load error:', err);
        var recoveryBox = document.getElementById('fallback-recovery-action');
        var statusTxt = document.getElementById('fallback-status-text');
        var errBox = document.getElementById('fallback-error-detail');
        if (recoveryBox) recoveryBox.style.display = 'block';
        if (statusTxt) statusTxt.innerText = 'خطایی در اجرای فایل‌های برنامه رخ داد. دکمه زیر را لمس کنید:';
        
        var msg = err.message || (err.target && (err.target.src || err.target.href)) || '';
        if (errBox && msg) {
          errBox.style.display = 'block';
          errBox.innerText = 'جزئیات خطا: ' + msg;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(err) {
        console.error('Unhandled rejection:', err);
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-['Vazirmatn',sans-serif] selection:bg-amber-400 selection:text-slate-900 antialiased overflow-x-hidden select-none">
    <div id="root">
      <div id="app-fallback-loader">
        <!-- Floating Math Badges in Background -->
        <div style="position: absolute; top: 12%; right: 14%; background: rgba(99, 102, 241, 0.22); border: 1px solid rgba(165, 180, 252, 0.35); color: #c7d2fe; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; animation: floatBadge1 3.4s ease-in-out infinite; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); pointer-events: none;">
          ➕
        </div>
        <div style="position: absolute; top: 18%; left: 12%; background: rgba(236, 72, 153, 0.22); border: 1px solid rgba(244, 114, 182, 0.35); color: #f472b6; width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; animation: floatBadge2 4.1s ease-in-out infinite; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); pointer-events: none;">
          ✖️
        </div>
        <div style="position: absolute; bottom: 26%; right: 12%; background: rgba(16, 185, 129, 0.22); border: 1px solid rgba(52, 211, 153, 0.35); color: #6ee7b7; width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; animation: floatBadge3 3.7s ease-in-out infinite; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); pointer-events: none;">
          ➗
        </div>
        <div style="position: absolute; bottom: 30%; left: 14%; background: rgba(245, 158, 11, 0.22); border: 1px solid rgba(251, 191, 36, 0.35); color: #fbbf24; width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; animation: floatBadge1 4.5s ease-in-out infinite 0.6s; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); pointer-events: none;">
          ⭐
        </div>

        <!-- Owl Character Hero Container -->
        <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
          <!-- Glowing Pulsating Backdrop Aura -->
          <div style="position: absolute; width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(circle, rgba(147, 51, 234, 0.45) 0%, rgba(79, 70, 229, 0.3) 45%, rgba(245, 158, 11, 0.1) 70%, transparent 85%); filter: blur(24px); animation: pulseAura 3s ease-in-out infinite; pointer-events: none;"></div>

          <!-- Large Cute Owl Character -->
          <img
            src="./assets/characters/owl/Teaching.webp"
            alt="استاد جغد دانشمند"
            width="200"
            height="200"
            style="width: min(210px, 52vw); max-width: 220px; height: auto; object-fit: contain; position: relative; z-index: 2; animation: owlFloat 3.2s ease-in-out infinite; filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.45)) drop-shadow(0 0 35px rgba(99, 102, 241, 0.3));"
          />
        </div>

        <!-- App Brand & Title with Persian Animation -->
        <div style="animation: titleEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; position: relative; z-index: 2; margin-bottom: 22px;">
          <h1 style="font-size: clamp(28px, 6.5vw, 38px); font-weight: 900; margin: 0 0 8px 0; color: #ffffff; letter-spacing: -0.5px; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; gap: 8px;">
            <span>قهرمان ریاضی</span>
            <span style="font-size: 26px; animation: floatBadge1 2.5s ease-in-out infinite;">✨</span>
          </h1>
          <p style="font-size: 14px; color: #cbd5e1; margin: 0; font-weight: 500; letter-spacing: 0.2px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); animation: subtitleEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;">
            Math Hero • دنیای شگفت‌انگیز بازی و یادگیری ریاضی
          </p>
        </div>

        <!-- Sleek Animated Progress Bar -->
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 2; width: 100%; max-width: 260px;">
          <div style="width: 100%; height: 7px; background: rgba(255, 255, 255, 0.12); border-radius: 9999px; overflow: hidden; position: relative; box-shadow: inset 0 1px 2px rgba(0,0,0,0.3); margin-bottom: 12px;">
            <div style="position: absolute; top: 0; height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899, #f59e0b); box-shadow: 0 0 12px rgba(168, 85, 247, 0.6); animation: splashProgressBar 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
          </div>
          <p id="fallback-status-text" style="font-size: 13px; color: #94a3b8; margin: 0; font-weight: 500; transition: all 0.3s ease;">در حال آماده‌سازی دنیای قهرمانان...</p>
        </div>

        <p id="fallback-error-detail" style="display: none; font-size: 11px; color: #f87171; margin-top: 10px; max-width: 320px; word-break: break-all; font-family: monospace; direction: ltr; text-align: left;"></p>

        <div id="fallback-recovery-action" style="display: none; margin-top: 24px; background: rgba(30, 41, 59, 0.85); border: 1px solid #334155; border-radius: 18px; padding: 18px; max-width: 330px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); position: relative; z-index: 10;">
          <button id="btn-reset-cache" type="button" onclick="window.hardResetApp()" style="background: linear-gradient(135deg, #4f46e5, #6366f1); color: #ffffff; border: none; padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35); transition: all 0.2s;">
            🔄 پاکسازی حافظه موقت و بارگذاری مجدد
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
